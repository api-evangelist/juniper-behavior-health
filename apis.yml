name: Juniper Behavioral Health
description: >-
  Juniper Behavioral Health (now operating as Camber, camber.health) is a
  healthcare revenue-cycle-management (RCM) software company for specialty and
  behavioral health providers. Founded in 2021 and backed by a16z, Y Combinator,
  and Craft Ventures, the company automates medical billing, claims processing,
  denial management, and payment analytics so behavioral and specialty clinicians
  (ABA, PT, ENT, allergy) can collect more from insurance and spend less time on
  administrative overhead. Their platform is built on AI systems trained on more
  than $2.5B in claims data. This profile was surfaced as an a16z portfolio company
  and enriched from the public Camber website; the company exposes a customer web
  application (app.camber.health) and a published responsible-disclosure policy but
  no public developer API, SDKs, or API documentation at this time.
